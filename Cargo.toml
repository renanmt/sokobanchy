[package]
name = "sokobanchy"
version = "0.1.0"
authors = ["Renan"]
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first Sokoban game for Omarchy"
license = "GPL-3.0-or-later"
repository = "https://github.com/renanmt/sokobanchy"
exclude = ["shared/", "preview.png", "dist/", "bin/"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
png = "0.18.1"

[profile.release]
lto = "thin"
strip = true
