name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Rust tooling
        run: rustup update stable && rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Packaging scripts
        run: bash -n scripts/*.sh packaging/*.sh
      - name: Manifest contract
        run: python3 scripts/check-manifest.py
      - name: Bundled executable and source identity
        run: python3 scripts/bundle.py check
  launcher:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Arch runtime and test tooling
        run: pacman -Syu --noconfirm python
      - uses: actions/checkout@v4
      - name: Launch without build or download tools
        run: python3 scripts/test-launch.py
